version: "3"

tasks:
  default:
    desc: Run fmt, vet, lint, and test
    deps: [fmt, vet, lint, test]

  test:
    desc: Run all tests
    cmds:
      - echo "Running tests..."
      - go test ./...

  test-verbose:
    desc: Run tests with verbose output
    cmds:
      - echo "Running tests with verbose output..."
      - go test -v ./...

  test-coverage:
    desc: Run tests and show coverage percentage
    cmds:
      - echo "Running tests with coverage..."
      - go test -cover ./...

  fmt:
    desc: Format code with gofmt
    cmds:
      - echo "Formatting code..."
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - echo "Running go vet..."
      - go vet ./...

  golangci-lint-check-installed:
    desc: Check if golangci-lint is installed
    internal: true
    preconditions:
      - sh: command -v golangci-lint
        msg: |
          golangci-lint not found. Install with:
            go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
            or visit https://golangci-lint.run/welcome/install/

  lint:
    desc: Run golangci-lint
    deps: [golangci-lint-check-installed]
    cmds:
      - echo "Running linter..."
      - golangci-lint run

  build:
    desc: Build the package
    cmds:
      - echo "Building package..."
      - go build ./...

  build-plugin:
    desc: Build all protoc plugin binaries
    deps: [build-plugin-go, build-plugin-elixir, build-plugin-elixir-grpc, build-plugin-pony]

  build-plugin-go:
    desc: Build the Go Connect protoc plugin binary
    cmds:
      - echo "Building Go Connect protoc plugin binary..."
      - go build -o protoc-gen-connect-go-servicestruct ./cmd/protoc-gen-connect-go-servicestruct

  build-plugin-elixir:
    desc: Build the Elixir protoc plugin binary
    cmds:
      - echo "Building Elixir protoc plugin binary..."
      - go build -o protoc-gen-elixir ./cmd/protoc-gen-elixir

  build-plugin-elixir-grpc:
    desc: Build the Elixir gRPC protoc plugin binary
    cmds:
      - echo "Building Elixir gRPC protoc plugin binary..."
      - go build -o protoc-gen-elixir-grpc ./cmd/protoc-gen-elixir-grpc

  build-plugin-pony:
    desc: Build the Pony protoc plugin binary
    cmds:
      - echo "Building Pony protoc plugin binary..."
      - go build -o protoc-gen-pony ./cmd/protoc-gen-pony

  clean:
    desc: Clean build artifacts and coverage files
    cmds:
      - echo "Cleaning artifacts..."
      - rm -rf dist/
      - rm -f coverage.out coverage.html
      - rm -f protoc-gen-*
