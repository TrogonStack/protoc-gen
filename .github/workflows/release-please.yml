---
name: cd / release please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-app-releaser
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.RELEASER_PROJECT_ID }}
          workload_identity_provider: ${{ vars.RELEASER_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Releaser key
        id: releaser_key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private_key:${{ vars.RELEASER_PRIVATE_KEY_SECRET }}

      - name: Releaser token
        id: releaser
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ steps.releaser_key.outputs.private_key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: TrogonStack/github-actions/actions/release-please@fa5c7e1fb4020228d00ebf5f4b3b8e1da4dffb62 # release-please@v0.2.0
        with:
          token: ${{ steps.releaser.outputs.token }}
