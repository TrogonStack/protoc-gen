---
name: cd

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (snapshot, no publish)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      tag:
        description: 'Tag to use for version extraction (optional, e.g., protoc-gen-elixir-grpc@v0.2.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Release with GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.24"

      - name: Install mise
        uses: jdx/mise-action@v4.2.3

      - name: Extract Version from Tag
        id: version
        run: mise run github-actions:extract-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}

      - name: Run GoReleaser (Snapshot)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish --config .github/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMPONENT: ${{ steps.version.outputs.component }}

      - name: Run GoReleaser (Release)
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate --config .github/goreleaser.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_COMPONENT: ${{ steps.version.outputs.component }}

      - name: Attest Build Provenance
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        uses: actions/attest@v4.1.1
        with:
          subject-path: "dist/**/*.tar.gz"

      - name: Upload Snapshot Artifacts
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: snapshot-${{ steps.version.outputs.component }}-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 7
